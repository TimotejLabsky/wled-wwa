# Upstream sync: comment `/upstream [ref]` on any issue or PR, or run
# `gh workflow run upstream-sync -R TimotejLabsky/wled-wwa -f branch=<ref>`.
# <ref> is a wled/WLED branch (default 16_x, the v16 line this fork tracks) or a
# release tag (e.g. v16.0.2; upstream cuts releases as side commits off 16_x,
# so RELEASE.md says to merge the tag itself). Merges it into a fresh
# `upstream-sync/<ref>-<sha>` branch and opens a PR into main with a real merge
# commit (merge it with a merge commit, never squash). Every reply also lists
# upstream release tags of the fork's major version that main doesn't contain.
#
# Conflicts are committed WITH markers into a draft PR; resolve them there by
# commenting `/oc resolve the merge conflicts` (opencode.yml) or by hand.
#
# Plain git, no LLM; runs on the home-cluster ARC runner (shared with /oc, so it
# queues behind a running agent). The runner image has no gh CLI: API calls use
# curl + jq. GITHUB_TOKEN may not push commits that touch .github/workflows:
# without an UPSTREAM_SYNC_TOKEN secret (fine-grained PAT, wled-wwa only:
# contents, pull-requests, workflows read/write) upstream workflow changes are
# left out and listed in the PR. With the PAT the PR also triggers build CI.
name: upstream-sync

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      branch:
        description: wled/WLED branch or release tag to merge
        default: 16_x

jobs:
  sync:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.comment.user.login == 'TimotejLabsky' && startsWith(github.event.comment.body, '/upstream'))
    runs-on: arc-runner-wled-wwa
    timeout-minutes: 90   # incl. queue wait behind an /oc run
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
      HAS_PAT: ${{ secrets.UPSTREAM_SYNC_TOKEN != '' }}
      REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
      COMMENT: ${{ github.event.comment.body }}
      INPUT_BRANCH: ${{ inputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Merge upstream and open PR
        run: |
          set -euo pipefail
          NOTE=""
          api() {  # api METHOD PATH [JSON]
            curl -fsS -X "$1" -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/$2" ${3:+-d "$3"}
          }
          reply() {
            local msg="$1"
            [ -z "$NOTE" ] || msg=$(printf '%s\n\n%s' "$1" "$NOTE")
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            [ -z "$ISSUE" ] || api POST "issues/$ISSUE/comments" "$(jq -n --arg b "$msg" '{body: $b}')" > /dev/null || true
          }

          B=${INPUT_BRANCH:-$(printf '%s\n' "$COMMENT" | head -1 | awk '{print $2}')}
          B=${B:-16_x}
          case "$B" in *[!A-Za-z0-9._/-]*) reply "Invalid ref name \`$B\`."; exit 1;; esac

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/wled/WLED.git

          # Upstream release tags (vMAJOR.x.y, peeled to commits) that main doesn't contain yet.
          MAJOR=$(jq -r .version package.json | cut -d. -f1)
          NEW_TAGS=$(git ls-remote --tags upstream "v$MAJOR.*" | awk -v re="^v${MAJOR}[.][0-9]+[.][0-9]+$" '
              { r = $2; sub("refs/tags/", "", r)
                if (r ~ /\^\{\}$/) { sub(/\^\{\}$/, "", r); c[r] = $1 } else if (!(r in c)) c[r] = $1 }
              END { for (r in c) if (r ~ re) print c[r], r }' |
            while read -r sha tag; do
              if ! { git cat-file -e "$sha^{commit}" 2>/dev/null && git merge-base --is-ancestor "$sha" HEAD; }; then
                [ "$tag" = "$B" ] || echo "$tag"
              fi
            done | sort -V | tr '\n' ' ')
          if [ -n "$NEW_TAGS" ]; then
            NOTE="📦 Upstream release tag(s) not yet in main: $(printf '`%s` ' $NEW_TAGS)— sync with \`/upstream <tag>\`."
          fi

          if git ls-remote --exit-code --tags upstream "refs/tags/$B" > /dev/null; then
            KIND=tag
            git fetch -q --no-tags upstream "+refs/tags/$B:refs/remotes/upstream/$B"
          elif git fetch -q --no-tags upstream "$B"; then
            KIND=branch
          else
            reply "\`$B\` is neither a branch nor a tag in wled/WLED."; exit 1
          fi

          UP=$(git rev-parse "upstream/$B^{commit}"); SHORT=${UP:0:7}
          BEHIND=$(git rev-list --count --no-merges "HEAD..$UP")
          if [ "$BEHIND" -eq 0 ]; then
            reply "main already contains wled/WLED $KIND \`$B\` @ \`$SHORT\`; nothing to sync."; exit 0
          fi

          BR="upstream-sync/$B-$SHORT"
          if git ls-remote --exit-code --heads origin "$BR" > /dev/null; then
            PR=$(api GET "pulls?state=all&head=${REPO%%/*}:$BR" | jq -r '.[0].html_url // empty')
            reply "A sync for \`$B\` @ \`$SHORT\` already exists: ${PR:-branch $BR}"; exit 0
          fi

          git switch -c "$BR"
          BASE=$(git merge-base HEAD "$UP")
          BOTH=$(comm -12 <(git diff --name-only "$BASE" HEAD | sort) <(git diff --name-only "$BASE" "$UP" | sort))
          MSG="Merge wled/WLED $KIND $B ($SHORT) into wled-wwa"

          CONFLICTS=""
          if ! git merge --no-ff --no-edit -m "$MSG" "$UP"; then
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            git add -A
          fi

          SKIPPED=""
          if [ "$HAS_PAT" != "true" ]; then
            SKIPPED=$(git diff --cached --name-only main -- .github/workflows)
            for f in $SKIPPED; do
              if git cat-file -e "main:$f" 2>/dev/null; then git checkout main -- "$f"; else git rm -q --cached "$f"; rm -f "$f"; fi
            done
          fi

          if [ -n "$CONFLICTS" ]; then
            git commit -q --no-edit -m "$MSG (UNRESOLVED CONFLICTS)"
          elif [ -n "$SKIPPED" ]; then
            git commit -q --amend --no-edit
          fi

          git push -q origin "$BR"

          {
            echo "Merges **wled/WLED $KIND \`$B\`** @ [\`$SHORT\`](https://github.com/wled/WLED/commit/$UP) into \`main\`: **$BEHIND** new upstream commits. Merge with a **merge commit**, never squash."
            echo
            if [ -n "$CONFLICTS" ]; then
              echo "### ⚠️ Unresolved conflicts (committed with markers)"
              printf -- '- `%s`\n' $CONFLICTS
              echo
              echo "Resolve with a comment on this PR, e.g. \`/oc resolve the merge conflicts, keeping the WWA amber, fade curve and dithering changes\`, then mark ready."
              [ "$KIND" != tag ] || echo "Release tag: on \`package.json\` / \`package-lock.json\` keep the fork's \`-dev-wwa\` version (RELEASE.md)."
              echo
            fi
            if [ -n "$BOTH" ]; then
              echo "### Files changed on both sides (check the fork delta survived)"
              printf -- '- `%s`\n' $BOTH
              echo
            fi
            if [ -n "$SKIPPED" ]; then
              echo "### Upstream workflow changes left out"
              echo "GITHUB_TOKEN can't push workflow files; add an \`UPSTREAM_SYNC_TOKEN\` secret to include them:"
              printf -- '- `%s`\n' $SKIPPED
              echo
            fi
            echo "<details><summary>Upstream commits</summary>"
            echo
            git log --no-merges --format='- %h %s' "main..$UP" | head -200
            echo
            echo "</details>"
          } > "$RUNNER_TEMP/body.md"

          DRAFT=false; [ -z "$CONFLICTS" ] || DRAFT=true
          URL=$(api POST pulls "$(jq -n --arg h "$BR" --arg t "Merge upstream wled/WLED $B ($SHORT)" \
                  --rawfile b "$RUNNER_TEMP/body.md" --argjson d "$DRAFT" \
                  '{base: "main", head: $h, title: $t, body: $b, draft: $d}')" | jq -r .html_url)
          if [ -n "$CONFLICTS" ]; then
            reply "Opened draft $URL: $BEHIND upstream commits, **$(echo "$CONFLICTS" | wc -w) conflicted file(s)**."
          else
            reply "Opened $URL: $BEHIND upstream commits, merged cleanly."
          fi
